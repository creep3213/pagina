<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita - Huellitas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html"><i class="bi bi-heart-fill text-warning"><span>🐾</span></i> Huellitas | Panel Cliente</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="mascotas.html">Mis Mascotas</a>
                <a class="nav-link active" href="agendar.html">Agendar Cita</a>
                <a class="nav-link" href="mis-citas.html">Mis Citas</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow border-0 rounded-4 p-4">
                    <h1 class="h3 fw-bold text-success mb-3 text-center">Agendar Nueva Cita</h1>
                    <p class="text-muted text-small text-center mb-4">Selecciona los detalles para tu cita veterinaria.</p>

                    <div id="citaContainer">
                        <!-- Selección de Mascota -->
                        <div class="mb-3">
                            <label for="selectMascota" class="form-label fw-bold">Seleccionar Mascota</label>
                            <select class="form-select" id="selectMascota" required>
                                <option value="">-- Seleccione su mascota --</option>
                                <option value="firulais">Firulais (Canino)</option>
                            </select>
                        </div>

                        <!-- Selección de Servicio -->
                        <div class="mb-3">
                            <label for="selectServicio" class="form-label fw-bold">Servicio Requerido</label>
                            <select class="form-select" id="selectServicio" required>
                                <option value="">-- Seleccione servicio --</option>
                                <option value="consulta">Consulta Médica ($45.000)</option>
                                <option value="vacuna">Vacunación ($35.000)</option>
                                <option value="bano">Baño ($40.000)</option>
                                <option value="peluqueria">Peluquería ($60.000)</option>
                            </select>
                        </div>

                        <!-- Veterinario (Solo para consulta) -->
                        <div class="mb-3">
                            <label for="selectVet" class="form-label fw-bold">Veterinario (Opcional / Solo Consulta)</label>
                            <select class="form-select" id="selectVet">
                                <option value="">-- Sin preferencia --</option>
                                <option value="carlos">Dr. Carlos Pérez</option>
                                <option value="ana">Dra. Ana Gómez</option>
                                <option value="luis">Dr. Luis Torres</option>
                            </select>
                        </div>

                        <!-- Fecha y Hora -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="fechaCita" class="form-label fw-bold">Fecha de la Cita</label>
                                <input type="date" class="form-control" id="fechaCita" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="horaCita" class="form-label fw-bold">Hora Disponible</label>
                                <select class="form-select" id="horaCita" required>
                                    <option value="">-- Seleccione hora --</option>
                                    <option value="08:00">08:00 a. m.</option>
                                    <option value="08:30" disabled>08:30 a. m. (Ocupada)</option>
                                    <option value="09:00">09:00 a. m.</option>
                                    <option value="10:00">10:00 a. m.</option>
                                </select>
                            </div>
                        </div>

                        <!-- Observaciones -->
                        <div class="mb-4">
                            <label for="observaciones" class="form-label fw-bold">Observaciones / Motivo</label>
                            <textarea class="form-control" id="observaciones" rows="3" placeholder="Detalle síntomas o instrucciones especiales"></textarea>
                        </div>

                        <!-- El botón ahora es tipo "button" y ejecuta una función JavaScript -->
                        <button type="button" id="btnAgendar" class="btn btn-success w-100 py-2 fw-bold">Confirmar y Agendar Cita</button>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.getElementById('btnAgendar').addEventListener('click', function() {
            // Obtener los valores de los elementos mediante sus IDs
            const mascota = document.getElementById('selectMascota').value;
            const servicio = document.getElementById('selectServicio').value;
            const veterinario = document.getElementById('selectVet').value;
            const fecha = document.getElementById('fechaCita').value;
            const hora = document.getElementById('horaCita').value;
            const observaciones = document.getElementById('observaciones').value;

            // Validación simple para asegurar que los campos requeridos no estén vacíos
            if (!mascota || !servicio || !fecha || !hora) {
                alert('Por favor, completa los campos requeridos antes de continuar.');
                return;
            }

            // Construir la URL con los parámetros estilo GET
            const params = new URLSearchParams({
                mascota: mascota,
                servicio: servicio,
                veterinario: veterinario,
                fecha: fecha,
                hora: hora,
                observaciones: observaciones
            });

            // Redirigir a la página de confirmación enviando los datos en la URL
            window.location.href = `cita-confirmada.html?${params.toString()}`;
        });
    </script>
</body>
</html>
