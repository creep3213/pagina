<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Huellitas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-success shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-heart-fill text-warning"><span>🐾</span></i> Huellitas</a>
            <a href="index.html" class="text-white text-decoration-none small"><i class="bi bi-house"></i> Volver al inicio</a>
        </div>
    </nav>

    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow border-0 rounded-4 p-4">
                    <div class="text-center mb-4">
                        <h1 class="h3 fw-bold text-success">Iniciar Sesión</h1>
                        <p class="text-muted small">Accede a tu panel de cliente o personal.</p>
                    </div>

                    <form action="cliente/mascotas.html" method="GET">
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="loginCorreo" placeholder="nombre@ejemplo.com" required>
                            <label for="loginCorreo">Correo electrónico o Cédula</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="loginPassword" placeholder="Contraseña" required>
                            <label for="loginPassword">Contraseña</label>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold mb-3">Ingresar</button>
                        
                        <div class="text-center">
                            <a href="registro.html" class="small text-decoration-none text-success">¿No tienes cuenta? Regístrate aquí</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
